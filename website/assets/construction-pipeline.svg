<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="70mm" viewBox="0 0 519 198" role="img" aria-labelledby="title desc">
  <title id="title">ReproBoundary construction pipeline</title>
  <desc id="desc">Four stages move from paper collection and screening to experiment eligibility review, target experiment selection, and validated task specification. The output is 47 tasks, 47 evaluator contracts, nine model-agent configurations, and 423 trajectories.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4b74b9"/>
    </marker>
  </defs>
  <rect width="519" height="198" fill="#ffffff"/>

  <g id="n:collect">
    <rect x="10" y="22" width="105" height="92" rx="4" fill="#f7f9fc" stroke="#b8c5d9"/>
    <circle cx="26" cy="39" r="10" fill="#4b74b9"/>
    <text x="26" y="41.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#ffffff">1</text>
    <text x="39" y="37" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#20242a">Collect and screen</text>
    <text x="39" y="46" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#20242a">papers</text>
    <line x1="21" y1="56" x2="104" y2="56" stroke="#d5dce7"/>
    <text x="21" y="71" font-family="Arial, Helvetica, sans-serif" font-size="5.8" fill="#30343a">Verify repositories and</text>
    <text x="21" y="80" font-family="Arial, Helvetica, sans-serif" font-size="5.8" fill="#30343a">released materials.</text>
    <text x="21" y="97" font-family="Arial, Helvetica, sans-serif" font-size="5.4" fill="#68707a">Paper + repository</text>
  </g>

  <path id="e:collect-review" d="M117 68 H130" fill="none" stroke="#4b74b9" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g id="n:review">
    <rect x="134" y="22" width="105" height="92" rx="4" fill="#f7f9fc" stroke="#b8c5d9"/>
    <circle cx="150" cy="39" r="10" fill="#4b74b9"/>
    <text x="150" y="41.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#ffffff">2</text>
    <text x="163" y="37" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#20242a">Review experiment</text>
    <text x="163" y="46" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#20242a">eligibility</text>
    <line x1="145" y1="56" x2="228" y2="56" stroke="#d5dce7"/>
    <text x="145" y="71" font-family="Arial, Helvetica, sans-serif" font-size="5.8" fill="#30343a">Check resource access,</text>
    <text x="145" y="80" font-family="Arial, Helvetica, sans-serif" font-size="5.8" fill="#30343a">method, and evaluator.</text>
    <text x="145" y="97" font-family="Arial, Helvetica, sans-serif" font-size="5.4" fill="#68707a">Evidence-backed review</text>
  </g>

  <path id="e:review-select" d="M241 68 H254" fill="none" stroke="#4b74b9" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g id="n:select">
    <rect x="258" y="22" width="105" height="92" rx="4" fill="#f7f9fc" stroke="#b8c5d9"/>
    <circle cx="274" cy="39" r="10" fill="#4b74b9"/>
    <text x="274" y="41.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#ffffff">3</text>
    <text x="287" y="37" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#20242a">Select target</text>
    <text x="287" y="46" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#20242a">experiments</text>
    <line x1="269" y1="56" x2="352" y2="56" stroke="#d5dce7"/>
    <text x="269" y="71" font-family="Arial, Helvetica, sans-serif" font-size="5.8" fill="#30343a">Freeze one verifiable</text>
    <text x="269" y="80" font-family="Arial, Helvetica, sans-serif" font-size="5.8" fill="#30343a">result and target metric.</text>
    <text x="269" y="97" font-family="Arial, Helvetica, sans-serif" font-size="5.4" fill="#68707a">Experiment + metric</text>
  </g>

  <path id="e:select-specify" d="M365 68 H378" fill="none" stroke="#4b74b9" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g id="n:specify">
    <rect x="382" y="22" width="127" height="92" rx="4" fill="#eef3fb" stroke="#4b74b9" stroke-width="1.2"/>
    <circle cx="398" cy="39" r="10" fill="#4b74b9"/>
    <text x="398" y="41.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#ffffff">4</text>
    <text x="411" y="37" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#20242a">Specify and validate</text>
    <text x="411" y="46" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#20242a">tasks</text>
    <line x1="393" y1="56" x2="498" y2="56" stroke="#c8d5e8"/>
    <text x="393" y="71" font-family="Arial, Helvetica, sans-serif" font-size="5.8" fill="#30343a">Fix stages, data scope,</text>
    <text x="393" y="80" font-family="Arial, Helvetica, sans-serif" font-size="5.8" fill="#30343a">evaluator, and deliverables.</text>
    <text x="393" y="97" font-family="Arial, Helvetica, sans-serif" font-size="5.4" fill="#4b6488">Frozen task contract</text>
  </g>

  <path id="e:specify-output" d="M445.5 115 V127" fill="none" stroke="#4b74b9" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g id="n:output">
    <rect x="48" y="132" width="423" height="45" rx="5" fill="#27384f"/>
    <text x="259.5" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#ffffff">ReproBoundary frozen release</text>
    <text x="259.5" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="6.4" fill="#ffffff">47 tasks  ·  47 evaluator contracts  ·  9 model-agent configurations  ·  423 trajectories</text>
  </g>
</svg>
